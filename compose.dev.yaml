# Local development: PostgreSQL 18, a Keycloak with a development realm, and
# Mailpit, which catches every email.
#   docker compose -f compose.dev.yaml up -d
# Keycloak: http://localhost:8102 (admin / admin), realm "helpdesk", test
# users with the password "helpdesk-dev":
#   ada@example.org    superadmin   (group /helpdesk/superadmins)
#   alma@example.org   admin        (/helpdesk/admins)
#   oscar@example.org  operator     (/helpdesk/operators)
#   fiona@example.org  operator     (/helpdesk/operators/finance, a subgroup)
#   erin@example.org   requester    (/helpdesk/employees)
#   nora@example.org   no access    (no group)
# Mailpit: http://localhost:8028 (SMTP on localhost:1028).
# The production setup is compose.yaml.
name: helpdesk-dev

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: helpdesk
      POSTGRES_PASSWORD: helpdesk
      POSTGRES_DB: helpdesk
    ports:
      - "127.0.0.1:55448:5432"
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpdesk -d helpdesk"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2-3
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # The image sizes the heap from host RAM (up to 70 %); cap it for local use.
      JAVA_OPTS_KC_HEAP: "-Xms64m -Xmx512m"
    ports:
      - "127.0.0.1:8102:8080"
    volumes:
      - ./dev/keycloak:/opt/keycloak/data/import:ro

  mailpit:
    image: axllent/mailpit:v1.34
    ports:
      - "127.0.0.1:1028:1025"
      - "127.0.0.1:8028:8025"

volumes:
  postgres:
